schemaVersion: 1
kind: ordivon.repository-publication
repository: ordivon-org/ordivon-public
visibilityPolicy: public-by-default
currentRemoteStanding: PUBLIC_NATIVE
prePublicationGateRequired: true
organizationPolicy: https://github.com/ordivon-org/.github/blob/main/PUBLICATION_POLICY.md
privateOrEmbargoedExceptions:
  - live-secrets-and-authentication-material
  - raw-or-linkable-personal-data
  - private-correspondence-without-publication-authority
  - third-party-restricted-material
  - responsible-disclosure-security-material
  - patent-sensitive-work-before-publication-decision
  - operational-details-whose-disclosure-creates-unnecessary-risk
lastAuditedBaseRevision: 3d754f8e35b9ee68dda19452c1d526f36d82750c
publicationBoundary:
  includes:
    - remote-main
    - remote-branches
    - tags
    - reachable-history
    - commit-metadata
  excludes:
    - local-only-unpublished-commits
    - untracked-workstation-state
